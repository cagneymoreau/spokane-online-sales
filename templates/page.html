{% extends "base.html" %}
{% block content %}
<article class="page wrap">
  <header class="page-head">
    <p class="eyebrow">{{ page.eyebrow | default("Spokane Online Sales") }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ page.body_html | safe }}
  </div>
</article>
{% endblock %}
